[pytest]
pythonpath = src
testpaths = tests
addopts = -ra
markers =
    local_steam: requires local Steam client, installed Sheepy game, and visible desktop session
    tc_001: Steam environment check
    tc_002: Sheepy AppID launch check
    tc_003: Sheepy process detection check
    tc_004: Initial screen screenshot check
    tc_005: Black screen detection check
    tc_009: Language selection screen check
    tc_010: Gameplay entry from lobby check
    tc_017: Language selection input response check
    tc_018: Post-language lobby screen classification check
    tc_019: Lobby Continue and Start Your Journey option check
    tc_006: Basic action input response check
    tc_007: Short stability observation check
    tc_008: Failure evidence persistence check
    tc_011: Movement input response check
    tc_012: Freeze detection observation check
    tc_013: First-run player state identification check
    tc_014: Returning player state identification check
    tc_015: Save data preservation check
    tc_016: Basic movement and jump gameplay flow check
